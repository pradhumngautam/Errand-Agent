[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat agent for arranging home-service errands, with app-enforced approvals and verified, idempotent bookings"
readme = "README.md"
authors = [
    { name = "Pradhumn Gautam", email = "pradhumngautam0506@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
errand-chat = "errand_agent.cli:main"
errand-web = "errand_agent.web.app:main"
errand-eval = "errand_agent.evals.run:main"
